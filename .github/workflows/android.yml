name: Build Android APK Package

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android Package via Buildozer
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Java Development Kit
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Update System Repositories
        run: |
          sudo apt-get update -qq

      - name: Install System Dependencies
        run: |
          sudo apt-get install -y -qq \
            git \
            zip \
            unzip \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            cmake \
            libffi-dev \
            libssl-dev \
            automake \
            patch

      - name: Upgrade Pip and Packaging Tools
        run: |
          python3 -m pip install --upgrade pip setuptools wheel

      - name: Install Cython and Buildozer
        run: |
          python3 -m pip install cython==0.29.36 buildozer

      - name: Ensure Buildozer Specification Exists
        run: |
          if [ ! -f "buildozer.spec" ]; then
            buildozer init
          fi

      - name: Configure Buildozer Settings
        run: |
          sed -i 's/^log_level = .*/log_level = 2/' buildozer.spec
          sed -i 's/^# warn_on_root = .*/warn_on_root = 0/' buildozer.spec

      - name: Accept Android Licenses and Build APK
        run: |
          yes | buildozer -v android debug

      - name: Verify APK Generation
        run: |
          ls -lah bin/

      - name: Upload Built APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cod-calculator-apk
          path: bin/*.apk
          retention-days: 7
          if-no-files-found: error
